name: floatwatch daily snapshot
on:
  schedule:
    - cron: "17 * * * *"      # hourly; concentration moves intraday
  workflow_dispatch:
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 collect.py
      - run: python3 report.py > reports/$(date -u +%F).txt
      - run: |
          git config user.name  "floatwatch"
          git config user.email "bot@users.noreply.github.com"
          git add snapshots reports
          git diff --staged --quiet || git commit -m "snapshot $(date -u +%F-%H%M)"
          git push
